{% extends "admin_layout.html" %}

{% block page_content %}
<style>
    .form-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 0 40px;
    }

    .form-header {
        margin-bottom: 24px;
    }

    .form-header h1 {
        margin: 0 0 6px;
        color: #10263f;
        font-size: 32px;
        font-weight: 700;
    }

    .form-header p {
        margin: 0;
        color: #5f6e7c;
        font-size: 15px;
        font-weight: 600;
    }

    .form-card {
        background: #ffffff;
        border: 1px solid #e0e4ea;
        border-radius: 10px;
        padding: 24px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .field {
        margin-bottom: 18px;
    }

    .field.full {
        grid-column: 1 / -1;
    }

    .field label {
        display: block;
        color: #6b7786;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 7px;
    }

    .field input,
    .field textarea,
    .field select {
        width: 100%;
        border: 1px solid #dfe5ec;
        border-radius: 8px;
        padding: 11px 12px;
        color: #10263f;
        font-weight: 600;
        background: #ffffff;
    }

    .field textarea {
        min-height: 110px;
        resize: vertical;
    }

    .error-box {
        background: #fdecec;
        color: #a93939;
        border: 1px solid #f5c2c2;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 18px;
        font-weight: 700;
    }

    .actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 8px;
    }

    .btn-main,
    .btn-secondary {
        border-radius: 8px;
        padding: 11px 16px;
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
    }

    .btn-main {
        background: #10263f;
        color: #ffffff;
    }

    .btn-main:hover {
        background: #173553;
        color: #ffffff;
        text-decoration: none;
    }

    .btn-secondary {
        background: #ffffff;
        color: #10263f;
        border: 1px solid #dfe5ec;
    }

    .btn-secondary:hover {
        background: #eef3f7;
        color: #10263f;
        text-decoration: none;
    }

    @media (max-width: 700px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-header h1 {
            font-size: 26px;
        }

        .actions {
            flex-direction: column;
        }

        .btn-main,
        .btn-secondary {
            width: 100%;
            text-align: center;
        }
    }
</style>

<div class="form-page">
    <div class="form-header">
        <h1>Nuevo producto</h1>
        <p>Registra un producto para el catálogo de DOLCIMOMENTI.</p>
    </div>

    <div class="form-card">
        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/catalogo/productos/nuevo/">
            <div class="form-grid">
                <div class="field">
                    <label>Nombre del producto</label>
                    <input type="text" name="nombre" placeholder="Ej. Helado de fresa" required>
                </div>

                <div class="field">
                    <label>Categoría</label>
                    <select name="categoria_id">
                        <option value="">Sin categoría</option>
                        {% for categoria in categorias %}
                        <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label>Precio</label>
                    <input type="number" name="precio" step="0.01" min="0" placeholder="Ej. 12.00" required>
                </div>

                <div class="field">
                    <label>Stock</label>
                    <input type="number" name="stock" min="0" placeholder="Ej. 20" required>
                </div>

                <div class="field full">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Describe brevemente el producto."></textarea>
                </div>
            </div>

            <div class="actions">
                <a class="btn-secondary" href="/catalogo/productos/">Cancelar</a>
                <button class="btn-main" type="submit">Guardar producto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
